on:
  pull_request:
    branches:
      - main

jobs:
  test:
    # TODO : Maybe find a way to lint the .mdx file. For now, if it builds, it's good enough ¯\_(ツ)_/¯ 
    name: Making sure it builds
    uses: ./.github/workflows/build.yml     

  checks:
    name: Types et recherche
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22.18 minimum : les tests importent du TypeScript sans étape de compilation.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build

      - name: Type check
        run: npm run typecheck

      - name: Search tests
        run: npm test
